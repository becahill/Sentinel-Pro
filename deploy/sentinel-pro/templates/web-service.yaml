{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel-pro.fullname" . }}-web
  labels:
    {{- include "sentinel-pro.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "sentinel-pro.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
